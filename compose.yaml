services:
  news:
    build: .
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${PORT:-8080}:8080"
    environment:
      UPDATE_MINUTES: ${UPDATE_MINUTES:-30}
      RETENTION_DAYS: ${RETENTION_DAYS:-30}
      # Optional HTTP Basic authentication. Set both before remote access.
      AUTH_USER: ${AUTH_USER:-}
      AUTH_PASSWORD: ${AUTH_PASSWORD:-}
    volumes:
      - news-data:/app/data
    restart: unless-stopped
    mem_limit: 256m
    cpus: 0.75
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"
volumes:
  news-data:
